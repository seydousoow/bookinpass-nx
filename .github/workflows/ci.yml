name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Least-privilege default permissions.
permissions:
  contents: read

# Cancel obsolete PR runs, but never cancel main builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read

    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      # Optional: enable after configuring Nx Cloud distributed execution.
      # - name: Start Nx Cloud workers
      #   run: npx nx-cloud start-workers

      # Cache node_modules
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Start Nx Cloud workers
        run: npx nx-cloud start-workers

      - name: Install dependencies
        run: npm ci

      - name: Set Nx base and head SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Verify formatting
        run: npx nx format:check

      - name: Lint affected projects
        run: npx nx affected -t lint

      - name: Test affected projects
        run: npx nx affected -t test

      - name: Build affected projects
        run: npx nx affected -t build
