<bip-outside-click (outsideClick)="close()" [outsideClickEnabled]="opened()" class="relative">
  <label [class.sr-only]="hideLabel()" [for]="name()" class="mb-1 block text-xs font-semibold text-muted">{{ label() }}</label>

  <button
    (click)="toggle()"
    [attr.aria-expanded]="opened()"
    [attr.aria-haspopup]="'listbox'"
    [disabled]="disabled()"
    [ngClass]="{ 'border-border-strong hover:border-brand-primary/60': !opened(), 'border-brand-primary': opened(), 'border-state-error': error() }"
    class="bip-focusable flex min-h-11 w-full items-center gap-2 rounded-field border bg-surface-card px-3 py-2 text-left transition-colors"
    type="button">
    @if (prefix(); as icon) {
      <ng-icon [color]="prefixColor() || 'var(--text-ink)'" [svg]="icon" />
    }
    <span class="flex min-w-0 flex-1 flex-col items-start text-left">
      <span [class.text-muted]="!value()" class="w-full truncate text-sm font-medium">{{ value() || placeholder() || ('common.select' | transloco) }}</span>
    </span>
    <ng-icon [class.rotate-180]="opened()" class="transition-transform duration-150" color="var(--color-muted)" name="heroChevronDownSolid" />
  </button>

  @if (opened()) {
    <div
      [class.left-0]="align() === 'start'"
      [class.min-w-full]="panelWidth() === 'auto'"
      [class.right-0]="align() === 'end'"
      [class.w-full]="panelWidth() === 'trigger'"
      [class.w-max]="panelWidth() === 'auto'"
      class="absolute top-full z-30 mt-1 rounded-panel border border-border-subtle bg-surface-card shadow-panel">
      <ng-content />
    </div>
  }
</bip-outside-click>
